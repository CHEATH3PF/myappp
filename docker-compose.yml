version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql_containersb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: AA11bb22cc
      MYSQL_DATABASE: example_db
      MYSQL_USER: user
      MYSQL_PASSWORD: AA11bb22cc
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_containersb
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: AA11bb22cc
    ports:
      - "8083:80"

volumes:
  mysql_data: